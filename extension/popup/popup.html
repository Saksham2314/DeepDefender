<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepDefender</title>
  <link rel="stylesheet" href="../styles/popup.css" />
</head>
<body>
  <header>
    <h1>DeepDefender</h1>
    <div class="status-row">
      <span id="status-dot" class="status-dot status-unknown"></span>
      <span id="status-text">Checking...</span>
    </div>
  </header>

  <section class="section">
    <h2>Current page</h2>
    <div class="stat-row"><span>Analyzed</span><span id="stat-analyzed">0</span> text blocks</div>
    <div class="stat-row detected-row">
      <span class="pill pill-nag">NAG <span id="stat-nag">0</span></span>
      <span class="pill pill-cag">CAG <span id="stat-cag">0</span></span>
      <span class="pill pill-oag">OAG <span id="stat-oag">0</span></span>
    </div>
  </section>

  <section class="section">
    <h2>Settings</h2>
    <label class="checkbox-row">
      <input type="checkbox" id="setting-enabled" />
      Enable detection
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="setting-highlights" />
      Show highlights
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="setting-explanations" />
      Show explanations
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="setting-dynamic" />
      Analyze dynamically loaded content
    </label>

    <div class="slider-row">
      <label for="setting-threshold">Confidence threshold: <span id="threshold-value">70%</span></label>
      <input type="range" id="setting-threshold" min="0" max="100" step="5" />
    </div>
  </section>

  <footer>
    <span id="api-url-label"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
